# 第二层 child Application — range 渲染
# 每条 values.applications.<name> → 一个 Application 指向产品 k8s 仓的叶 manifest 目录
# cluster.name / cluster.domain / cluster.env 由第一层经 helm parameters 注入,本层透传给叶 chart(如有)
{{- range $appName, $appData := .Values.applications }}
{{- if or (not (hasKey $appData "enabled")) $appData.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $appName }}
  namespace: argocd
  {{- with $appData.additionalAnnotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
  {{- with $appData.additionalLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $appData.project }}
  destination:
    # 第一层 root app 会把目标 cluster.server 注入进来。
    # 第二层据此把 child Application 投递到对应集群;当前北京环境默认仍落当前 ACK。
    server: {{ $.Values.cluster.server | default $.Values.spec.destination.server }}
    namespace: {{ $appData.namespace }}
  source:
    repoURL: {{ $appData.source.repoURL | quote }}
    targetRevision: {{ $appData.source.targetRevision }}
    path: {{ $appData.source.path }}
    {{- if $appData.source.helm }}
    helm:
      {{- with $appData.source.helm.releaseName }}
      releaseName: {{ . | quote }}
      {{- end }}
      {{- with $appData.source.helm.valueFiles }}
      valueFiles:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 透传 cluster 上下文,供业务叶 chart 渲染镜像、域名和环境参数。
      parameters:
        {{- with $appData.source.helm.parameters }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: cluster.name
          value: {{ $.Values.cluster.name | quote }}
        - name: cluster.domain
          value: {{ $.Values.cluster.domain | quote }}
        - name: cluster.env
          value: {{ $.Values.cluster.env | quote }}
        # 叶 chart 用 region 渲染当前环境对应的镜像仓库或云侧资源域名。
        - name: region
          value: {{ $.Values.cluster.region | default "us-east-1" | quote }}
    {{- else }}
    directory:
      recurse: true
    {{- end }}
  {{- with $appData.syncPolicy }}
  syncPolicy:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # 下面的 ignoreDifferences 只作用于 **diff 判定**;缺这一项时 sync 仍会按
      # chart 值写回 /spec/replicas,把 HPA/KEDA 扩出的副本压回 chart 的 2。
      # 2026-08-26 实际发生过:同步 billing-api 的 ConfigMap 把副本从 12 压到 4。
      # 只加在本 else 分支:自定义 syncPolicy 的两个可观测性栈无 HPA,
      # 对它们而言 git 才是 replicas 的权威,加上反而让手工缩放不再被纠正。
      - RespectIgnoreDifferences=true
  {{- end }}
  # 默认 ignore Deployment / StatefulSet 的 spec.replicas drift —
  # HPA 是 replicas 的 source of truth(git 写多少都会被 HPA 推回 minReplicas)
  # 各 Application 如果有额外 ignoreDifferences,在 values 里 append 即可(本段是默认 base)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
    {{- with $appData.ignoreDifferences }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $appData.info }}
  info:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
